name: "CodeQL"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "mainline" ]
  pull_request:
    branches: [ "mainline" ]
  schedule:
    - cron: '0 8 * * MON'

permissions:
  security-events: write

jobs:
  Analysis:
    name: Analysis
    uses: aws-deadline/.github/.github/workflows/reusable_codeql.yml@mainline
