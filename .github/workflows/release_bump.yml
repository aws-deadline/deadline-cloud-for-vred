name: "Release: Bump"

on:
  workflow_dispatch:
    inputs:
      force_version_bump:
        required: false
        default: ""
        type: choice
        options:
        - ""
        - patch
        - minor
        - major

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: release

jobs:
  Bump:
    name: Version Bump
    uses: aws-deadline/.github/.github/workflows/reusable_bump.yml@mainline
    secrets: inherit
    with:
      force_version_bump: ${{ inputs.force_version_bump }}